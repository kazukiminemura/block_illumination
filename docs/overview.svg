<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#227582"/></marker></defs>
<style>text{font-family:'Yu Gothic','Meiryo','Segoe UI',sans-serif;fill:#193947;font-size:23px}.title{font-size:40px;font-weight:700}.sub{font-size:24px;fill:#57717c}.h{font-size:27px;font-weight:700}.small{font-size:20px}.tiny{font-size:18px;fill:#57717c}.wire{stroke:#227582;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.card{fill:#fff;stroke:#ccdae0;stroke-width:2}</style>
<rect width="1800" height="1360" fill="#f3f7f8"/><text x="64" y="76" class="title">CPU・GPU・NPU 使用率メーター</text><text x="64" y="119" class="sub">Pico 2 H ＋ XD3914 ＋ OSX10201-GYR1 ｜ Rev C 概要</text><rect x="1410" y="44" width="326" height="55" rx="27" fill="#e6f0ed" stroke="#b4d1c7" stroke-width="2"/><text x="1434" y="80" class="small">Rev C・近似モデル検証済み</text><rect x="64" y="165" width="490" height="205" rx="16" fill="#fff" stroke="#ccdae0" stroke-width="2"/><text x="90" y="210" class="h">① PC：数値を取得する</text><text x="90" y="254" class="">CPU / GPU / NPU の使用率</text><text x="90" y="294" class="">取得プログラム → USBで送信</text><text x="90" y="334" class="small">PC側の取得・送信は今後実装</text><path d="M 554 264 H 683" class="wire"/><text x="568" y="241" class="small">USB</text><rect x="690" y="165" width="510" height="205" rx="16" fill="#e7f3ee" stroke="#99bfae" stroke-width="2"/><text x="716" y="210" class="h">② Raspberry Pi Pico 2 H</text><text x="716" y="254" class="">受信した数値をPWMの比率へ変換</text><text x="716" y="294" class="">GP0 / GP2 / GP4 を独立に出力</text><text x="716" y="334" class="small">USB給電・GPIO信号は3.3V系</text><rect x="1265" y="165" width="471" height="205" rx="16" fill="#eaf2f8" stroke="#afc7d8" stroke-width="2"/><text x="1291" y="210" class="h">PWMとは？</text><text x="1291" y="254" class="">高速なON / OFF信号</text><text x="1291" y="294" class="">ONの時間割合で値を表す</text><text x="1291" y="334" class="small">次のRC回路で滑らかな電圧にする</text><text x="64" y="424" class="h">③ 数値を「電圧」に変え、10段階のバー表示へ</text><text x="64" y="462" class="small">各行は同じ回路を1セットずつ使用します。矢印は信号・制御の流れです。</text><rect x="64" y="500" width="1672" height="148" rx="16" fill="#fff" stroke="#d5e0e4" stroke-width="2"/><rect x="82" y="518" width="170" height="112" rx="16" fill="#e4f0f1" stroke="none" stroke-width="2"/><text x="111" y="560" class="h">CPU</text><text x="104" y="598" class="small">専用PWM</text><path d="M 252 574 H 340" class="wire"/><rect x="347" y="518" width="360" height="112" rx="16" fill="#f6f9fb" stroke="#c8d8df" stroke-width="2"/><text x="369" y="554" class="h">RC平滑回路</text><text x="369" y="585" class="small">4.7kΩ ＋ 4.7µF</text><text x="369" y="612" class="small">PWM → アナログ電圧</text><path d="M 707 574 H 824" class="wire"/><text x="726" y="552" class="small">電圧</text><rect x="831" y="518" width="355" height="112" rx="16" fill="#eaf4ef" stroke="#b7d2c3" stroke-width="2"/><text x="855" y="554" class="h">XD3914</text><text x="855" y="585" class="small">入力電圧を10段階で判定</text><text x="855" y="612" class="small">点灯本数とLED電流を制御</text><path d="M 1186 574 H 1303" class="wire"/><text x="1201" y="552" class="small">点灯制御</text><text x="1324" y="544" class="h">OSX10201-GYR1</text><rect x="1324" y="563" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1358" y="563" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1392" y="563" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1426" y="563" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1460" y="563" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1494" y="563" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1528" y="563" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1562" y="563" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1596" y="563" width="26" height="35" rx="3" fill="#d96955" stroke="none" stroke-width="2"/><rect x="1630" y="563" width="26" height="35" rx="3" fill="#d96955" stroke="none" stroke-width="2"/><text x="1324" y="626" class="small">黄緑5 ＋ 黄3 ＋ 赤2</text><rect x="64" y="668" width="1672" height="148" rx="16" fill="#fff" stroke="#d5e0e4" stroke-width="2"/><rect x="82" y="686" width="170" height="112" rx="16" fill="#e9edf8" stroke="none" stroke-width="2"/><text x="111" y="728" class="h">GPU</text><text x="104" y="766" class="small">専用PWM</text><path d="M 252 742 H 340" class="wire"/><rect x="347" y="686" width="360" height="112" rx="16" fill="#f6f9fb" stroke="#c8d8df" stroke-width="2"/><text x="369" y="722" class="h">RC平滑回路</text><text x="369" y="753" class="small">4.7kΩ ＋ 4.7µF</text><text x="369" y="780" class="small">PWM → アナログ電圧</text><path d="M 707 742 H 824" class="wire"/><text x="726" y="720" class="small">電圧</text><rect x="831" y="686" width="355" height="112" rx="16" fill="#eaf4ef" stroke="#b7d2c3" stroke-width="2"/><text x="855" y="722" class="h">XD3914</text><text x="855" y="753" class="small">入力電圧を10段階で判定</text><text x="855" y="780" class="small">点灯本数とLED電流を制御</text><path d="M 1186 742 H 1303" class="wire"/><text x="1201" y="720" class="small">点灯制御</text><text x="1324" y="712" class="h">OSX10201-GYR1</text><rect x="1324" y="731" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1358" y="731" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1392" y="731" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1426" y="731" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1460" y="731" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1494" y="731" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1528" y="731" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1562" y="731" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1596" y="731" width="26" height="35" rx="3" fill="#d96955" stroke="none" stroke-width="2"/><rect x="1630" y="731" width="26" height="35" rx="3" fill="#d96955" stroke="none" stroke-width="2"/><text x="1324" y="794" class="small">黄緑5 ＋ 黄3 ＋ 赤2</text><rect x="64" y="836" width="1672" height="148" rx="16" fill="#fff" stroke="#d5e0e4" stroke-width="2"/><rect x="82" y="854" width="170" height="112" rx="16" fill="#f0eafa" stroke="none" stroke-width="2"/><text x="111" y="896" class="h">NPU</text><text x="104" y="934" class="small">専用PWM</text><path d="M 252 910 H 340" class="wire"/><rect x="347" y="854" width="360" height="112" rx="16" fill="#f6f9fb" stroke="#c8d8df" stroke-width="2"/><text x="369" y="890" class="h">RC平滑回路</text><text x="369" y="921" class="small">4.7kΩ ＋ 4.7µF</text><text x="369" y="948" class="small">PWM → アナログ電圧</text><path d="M 707 910 H 824" class="wire"/><text x="726" y="888" class="small">電圧</text><rect x="831" y="854" width="355" height="112" rx="16" fill="#eaf4ef" stroke="#b7d2c3" stroke-width="2"/><text x="855" y="890" class="h">XD3914</text><text x="855" y="921" class="small">入力電圧を10段階で判定</text><text x="855" y="948" class="small">点灯本数とLED電流を制御</text><path d="M 1186 910 H 1303" class="wire"/><text x="1201" y="888" class="small">点灯制御</text><text x="1324" y="880" class="h">OSX10201-GYR1</text><rect x="1324" y="899" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1358" y="899" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1392" y="899" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1426" y="899" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1460" y="899" width="26" height="35" rx="3" fill="#63a86a" stroke="none" stroke-width="2"/><rect x="1494" y="899" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1528" y="899" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1562" y="899" width="26" height="35" rx="3" fill="#e4ba43" stroke="none" stroke-width="2"/><rect x="1596" y="899" width="26" height="35" rx="3" fill="#d96955" stroke="none" stroke-width="2"/><rect x="1630" y="899" width="26" height="35" rx="3" fill="#d96955" stroke="none" stroke-width="2"/><text x="1324" y="962" class="small">黄緑5 ＋ 黄3 ＋ 赤2</text><path d="M 945 370 V 397 H 50 V 574 H 81" class="wire dashed"/><path d="M 50 574 V 742 H 81" class="wire dashed"/><path d="M 50 742 V 910 H 81" class="wire dashed"/><rect x="64" y="1033" width="1672" height="118" rx="16" fill="#fff5e3" stroke="#e0c797" stroke-width="2"/><text x="90" y="1073" class="h">④ 電源とGND（共通の基準）</text><text x="90" y="1113" class="">Pico：USB給電 ／ XD3914・LED：外部安定化5V ／ 全回路のGNDを共通にする</text><text x="90" y="1140" class="small">LEDの＋側へ電源を供給し、−側をXD3914が駆動。外部5VをUSBのVBUSへ直結しない。</text><rect x="64" y="1178" width="1672" height="136" rx="16" fill="#eaf0f3" stroke="#c5d4dc" stroke-width="2"/><text x="90" y="1218" class="h">試作時に確認すること</text><text x="90" y="1253" class="small">各ICの基準電圧を校正 ／ 実機の電流・発熱・明るさ ／ USB通信</text><text x="90" y="1288" class="small">部品数：Pico 2 H ×1、XD3914 ×3、バーLED ×3。端子配線図ではなく、構成を理解するための図です。</text><text x="64" y="1343" class="tiny">2026-11-01 ｜ LTspiceは動作近似モデル。実機検証とPC側使用率取得は未実施です。</text></svg>