<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420"><style>text{font-family:Segoe UI,Meiryo,sans-serif;fill:#192c40;font-size:18px}.title{font-size:30px;font-weight:bold}.small{font-size:15px}.wire{fill:none;stroke:#2a6582;stroke-width:2} .box{fill:#f5f9fc;stroke:#36647c;stroke-width:2}</style><rect width="1600" height="1420" fill="white"/><text x="45" y="48" class="title">BLOCK ILLUMINATION / SIMULATION SCHEMATIC Rev A</text><text x="45" y="80" class="">暫定再設計：信号名ベース回路図 / 青線＝接続、同名ネット＝電気的接続</text><text x="45" y="109" class="small">写真からの完全復元ではありません。LED実端子・MOSFET型番・配線順は未確定。</text><rect class="box" x="45" y="145" width="235" height="185" rx="6"/><text x="57" y="173" class="">Pico 2 / 3.3 V GPIO</text><text x="57" y="199" class="small">GP2..5: R DATA/CLK/LAT/BLANK</text><text x="57" y="223" class="small">GP6..9: G DATA/CLK/LAT/BLANK</text><text x="57" y="247" class="small">BLANK入力: 10k → 3V3</text><text x="57" y="271" class="small">その他入力: 10k → GND</text><text x="57" y="295" class="small">USBからMCU給電 / 共通GND</text><rect class="box" x="355" y="145" width="260" height="185" rx="6"/><text x="367" y="173" class="">BUF1 / BUF2 AHCT125</text><text x="367" y="199" class="small">VCC(14)=5V / GND(7)=GND</text><text x="367" y="223" class="small">/OE(1,4,10,13)=GND</text><text x="367" y="247" class="small">A→Y: 2→3,5→6,9→8,12→11</text><text x="367" y="271" class="small">全8信号を3.3V→5V変換</text><text x="367" y="295" class="small">BLANK出力: 各10k → 5V</text><polyline class="wire" points="280,220 355,220"/><text x="285" y="207" class="small">8 signals</text><rect class="box" x="710" y="145" width="810" height="185" rx="6"/><text x="722" y="173" class="">電源・リセット条件</text><text x="722" y="199" class="small">外部安定化5V → 全ドライバVCC / P-MOSソース / LED電源</text><text x="722" y="223" class="small">全GND共通、MCU USBのVBUSとは直結しない</text><text x="722" y="247" class="small">各ロジックICに100nF、LED電源入口に1000uF（暫定値）</text><text x="722" y="271" class="small">起動時BLANK_R=BLANK_G=H → ゼロを64/48bit転送 → LAT各1回</text><text x="722" y="295" class="small">点灯中は行を1本だけ選択。初期値・リセット後のラッチ値は不定。</text><text x="45" y="373" class="title">01 / シリアルチェーンと列カソード（LED3枚＝横48 × 縦16）</text><text x="45" y="446" class="">DATA_R</text><rect class="box" x="200" y="410" width="260" height="135" rx="6"/><text x="212" y="438" class="">R1 / TLC5928PW</text><text x="212" y="464" class="small">SIN(2) → shift[0..15] → SOUT(22)</text><text x="212" y="488" class="small">OUT0..15 → LED1.R[0..15]</text><text x="212" y="512" class="small">SCLK(3) / LAT(4) / BLANK(21)</text><text x="212" y="536" class="small">IREF(23) → 3.3k → GND</text><polyline class="wire" points="130,445 200,445"/><rect class="box" x="530" y="410" width="260" height="135" rx="6"/><text x="542" y="438" class="">R2 / TLC5928PW</text><text x="542" y="464" class="small">SIN(2) → shift[0..15] → SOUT(22)</text><text x="542" y="488" class="small">OUT0..15 → LED2.R[0..15]</text><text x="542" y="512" class="small">SCLK(3) / LAT(4) / BLANK(21)</text><text x="542" y="536" class="small">IREF(23) → 3.3k → GND</text><polyline class="wire" points="460,445 530,445"/><rect class="box" x="860" y="410" width="260" height="135" rx="6"/><text x="872" y="438" class="">R3 / TLC5928PW</text><text x="872" y="464" class="small">SIN(2) → shift[0..15] → SOUT(22)</text><text x="872" y="488" class="small">OUT0..15 → LED3.R[0..15]</text><text x="872" y="512" class="small">SCLK(3) / LAT(4) / BLANK(21)</text><text x="872" y="536" class="small">IREF(23) → 3.3k → GND</text><polyline class="wire" points="790,445 860,445"/><polyline class="wire" points="1120,445 1190,445"/><rect class="box" x="1190" y="410" width="330" height="135" rx="6"/><text x="1202" y="438" class="">ROW1 → ROW2 / 74HC595</text><text x="1202" y="464" class="small">R3.SOUT → ROW1.SER(14)</text><text x="1202" y="488" class="small">ROW1.QH′(9) → ROW2.SER(14)</text><text x="1202" y="512" class="small">CLK(11)=SCLK_R / RCLK(12)=LAT_R</text><text x="1202" y="536" class="small">Q[0..15] → ULN入力</text><text x="45" y="636" class="">DATA_G</text><rect class="box" x="200" y="600" width="260" height="135" rx="6"/><text x="212" y="628" class="">G1 / TLC5928PW</text><text x="212" y="654" class="small">SIN(2) → shift[0..15] → SOUT(22)</text><text x="212" y="678" class="small">OUT0..15 → LED1.G[0..15]</text><text x="212" y="702" class="small">SCLK(3) / LAT(4) / BLANK(21)</text><text x="212" y="726" class="small">IREF(23) → 3.3k → GND</text><polyline class="wire" points="130,635 200,635"/><rect class="box" x="530" y="600" width="260" height="135" rx="6"/><text x="542" y="628" class="">G2 / TLC5928PW</text><text x="542" y="654" class="small">SIN(2) → shift[0..15] → SOUT(22)</text><text x="542" y="678" class="small">OUT0..15 → LED2.G[0..15]</text><text x="542" y="702" class="small">SCLK(3) / LAT(4) / BLANK(21)</text><text x="542" y="726" class="small">IREF(23) → 3.3k → GND</text><polyline class="wire" points="460,635 530,635"/><rect class="box" x="860" y="600" width="260" height="135" rx="6"/><text x="872" y="628" class="">G3 / TLC5928PW</text><text x="872" y="654" class="small">SIN(2) → shift[0..15] → SOUT(22)</text><text x="872" y="678" class="small">OUT0..15 → LED3.G[0..15]</text><text x="872" y="702" class="small">SCLK(3) / LAT(4) / BLANK(21)</text><text x="872" y="726" class="small">IREF(23) → 3.3k → GND</text><polyline class="wire" points="790,635 860,635"/><polyline class="wire" points="1120,635 1190,635"/><rect class="box" x="1190" y="600" width="330" height="135" rx="6"/><text x="1202" y="628" class="">G SOUT / 未接続</text><text x="1202" y="654" class="small">読み戻しは本版では未使用</text><text x="1202" y="678" class="small">BLANK=Hで全カソードOFF</text><text x="1202" y="702" class="small">1bit=ON / 0bit=OFF</text><text x="45" y="795" class="title">02 / 行アノード駆動の反復回路（y = 0..15）</text><rect class="box" x="45" y="830" width="250" height="165" rx="6"/><text x="57" y="858" class="">ROW1 / ROW2</text><text x="57" y="884" class="small">74HC595 各8bit</text><text x="57" y="908" class="small">/OE(13)=GND / /CLR(10)=5V</text><text x="57" y="932" class="small">QA..QH: 15,1,2,3,4,5,6,7</text><text x="57" y="956" class="small">ROW1→行0..7</text><text x="57" y="980" class="small">ROW2→行8..15</text><rect class="box" x="360" y="830" width="250" height="165" rx="6"/><text x="372" y="858" class="">ULN1 / ULN2</text><text x="372" y="884" class="small">ULN2803A / 反転ゲート駆動</text><text x="372" y="908" class="small">IN(1..8) ← 行Q出力</text><text x="372" y="932" class="small">OUT(18..11) → RG 100Ω</text><text x="372" y="956" class="small">GND(9)=GND / COM(10)=5V</text><text x="372" y="980" class="small">行Q=1 → ゲートをLowへ</text><polyline class="wire" points="295,900 360,900"/><text x="297" y="884" class="small">ROW_CTL[y]</text><rect class="box" x="690" y="830" width="290" height="165" rx="6"/><text x="702" y="858" class="">Q[y] / P-MOS</text><text x="702" y="884" class="small">S → 5V</text><text x="702" y="908" class="small">G ← RG 100Ω ← ULN.OUT</text><text x="702" y="932" class="small">RGS 10k: G–S間</text><text x="702" y="956" class="small">D → A_ROW[y]</text><text x="702" y="980" class="small">型番・実ピン・定格は未確定</text><polyline class="wire" points="610,900 690,900"/><text x="613" y="884" class="small">GATE[y]</text><rect class="box" x="1080" y="830" width="440" height="165" rx="6"/><text x="1092" y="858" class="">LED1 / LED2 / LED3</text><text x="1092" y="884" class="small">A_ROW[y] → 3枚の同じ行アノード</text><text x="1092" y="908" class="small">赤LED: A_ROW[y] → LED → K_R[x]</text><text x="1092" y="932" class="small">緑LED: A_ROW[y] → LED → K_G[x]</text><text x="1092" y="956" class="small">各カソード → 対応TLC5928.OUT → GND</text><text x="1092" y="980" class="small">A/Kは機能端子名。物理端子番号は要照合。</text><polyline class="wire" points="980,900 1080,900"/><text x="982" y="884" class="small">A_ROW[y]</text><text x="45" y="1040" class="title">03 / 1行の制御タイミング（仮定：1 MHz、行周期1 ms）</text><rect class="box" x="45" y="1070" width="200" height="80" rx="6"/><text x="57" y="1098" class="">1 µs</text><text x="57" y="1124" class="small">BLANK H</text><rect class="box" x="260" y="1070" width="200" height="80" rx="6"/><text x="272" y="1098" class="">64 µs</text><text x="272" y="1124" class="small">R: 行16+列48</text><rect class="box" x="475" y="1070" width="200" height="80" rx="6"/><text x="487" y="1098" class="">48 µs</text><text x="487" y="1124" class="small">G: 列48</text><rect class="box" x="690" y="1070" width="200" height="80" rx="6"/><text x="702" y="1098" class="">1 µs</text><text x="702" y="1124" class="small">setup</text><rect class="box" x="905" y="1070" width="200" height="80" rx="6"/><text x="917" y="1098" class="">1 µs</text><text x="917" y="1124" class="small">LAT H</text><rect class="box" x="1120" y="1070" width="200" height="80" rx="6"/><text x="1132" y="1098" class="">100 µs</text><text x="1132" y="1124" class="small">行安定待ち</text><rect class="box" x="1335" y="1070" width="200" height="80" rx="6"/><text x="1347" y="1098" class="">785 µs</text><text x="1347" y="1124" class="small">BLANK L / 点灯</text><text x="45" y="1190" class="small">送信順：ROW15..ROW0 → R3.OUT15..0 → R2.OUT15..0 → R1.OUT15..0</text><text x="45" y="1220" class="small">緑送信順：G3.OUT15..0 → G2.OUT15..0 → G1.OUT15..0。LATは各転送につき1回のみ。</text><text x="45" y="1250" class="small">16行 / 62.5 Hz。LED実効Duty=785µs/16ms=4.91%。100µs待ちはLTspice仮定モデルで選定。</text><text x="45" y="1290" class="small">電流仮定：I_LED=1.2×42/3.3kΩ ≈15.27mA。両色48列ON時、行ピーク≈1.47A。</text><text x="45" y="1320" class="small">ULN2803AはLED行電流を供給しない。大電流はP-MOSが供給。電源・熱・Vf・遅延は本モデルの対象外。</text><text x="45" y="1370" class="small">対応する全端子接続表: connections.csv / 実行モデル: model.cjs / 波形: scan.vcd</text></svg>