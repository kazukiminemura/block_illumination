<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><style>text{font-family:Segoe UI,Meiryo,sans-serif;font-size:20px;fill:#17354a}.h{font-size:28px;font-weight:bold}.w{fill:none;stroke:#246684;stroke-width:3}.box{fill:#f3f8fc;stroke:#246684;stroke-width:2}</style><rect width="1600" height="1500" fill="white"/><text x="40" y="50" class="h">BLOCK ILLUMINATION / Rev B / 2026-11-01</text><text x="40" y="88" class="">試作配線図：全端子は assembly-connections.csv / 全体回路は full_circuit.svg</text><rect class="box" x="40" y="125" width="370" height="230" rx="5"/><text x="56" y="161" class="h">Pico 2 H / USB給電</text><text x="56" y="197" class="">GP2..5: 赤 DATA/CLK/LAT/BLANK</text><text x="56" y="226" class="">GP6..9: 緑 DATA/CLK/LAT/BLANK</text><text x="56" y="255" class="">GP10: RUN_EN（追加）</text><text x="56" y="284" class="">3V3_OUT(36): GPIO側抵抗のみ</text><text x="56" y="313" class="">GND(3): 外部5VのGNDと共通</text><rect class="box" x="485" y="125" width="470" height="230" rx="5"/><text x="501" y="161" class="h">BUF1 / BUF2 : AHCT125N</text><text x="501" y="197" class="">VCC14=5V / GND7=GND</text><text x="501" y="226" class="">/OE 1,4,10,13 = BUF_OE_N</text><text x="501" y="255" class="">A→Y: 2→3, 5→6, 9→8, 12→11</text><text x="501" y="284" class="">BLANK出力: 10kで5Vへ</text><text x="501" y="313" class="">他6出力: 10kでGNDへ</text><path class="w" d="M410 240 L485 240"/><rect class="box" x="1040" y="125" width="520" height="230" rx="5"/><text x="1056" y="161" class="h">5V外部電源 / 2A容量</text><text x="1056" y="197" class="">J_PWR.1=5V / .2=GND</text><text x="1056" y="226" class="">Cbulk 1000uF / 各IC100nF</text><text x="1056" y="255" class="">PicoはUSB給電、VBUSと直結しない</text><text x="1056" y="284" class="">1色5.04mA / 最大96列=0.484A</text><text x="1056" y="313" class="">実装時は低電流から段階的に確認</text><rect class="box" x="40" y="405" width="1520" height="175" rx="5"/><text x="56" y="441" class="h">QENによる初期消灯（/OEの5VをGPIOへ接続しない）</text><text x="56" y="477" class="">GP10 → REN 4.7k → QEN.2(B) ／ QEN.1(E) → GND ／ QEN.3(C) → BUF_OE_N</text><text x="56" y="506" class="">REN_PD 100k: B→GND ／ ROE 10k: BUF_OE_N→5V ／ 2N3904はonsemi TO-92を指定</text><text x="56" y="535" class="">RUN_EN=0/未接続 → バッファHi-Z → BLANK=H。開始時はBLANK=Hを設定してからRUN_EN=1。</text><text x="40" y="690" class="">DATA_R</text><rect class="box" x="195" y="625" width="320" height="140" rx="5"/><text x="211" y="661" class="h">R1 / TLC5928PW</text><text x="211" y="697" class="">SIN2 → SOUT22</text><text x="211" y="726" class="">pin5..20 → LED1 R</text><text x="211" y="755" class="">IREF23 → 10k → GND</text><path class="w" d="M145 685 L195 685"/><rect class="box" x="560" y="625" width="320" height="140" rx="5"/><text x="576" y="661" class="h">R2 / TLC5928PW</text><text x="576" y="697" class="">SIN2 → SOUT22</text><text x="576" y="726" class="">pin5..20 → LED2 R</text><text x="576" y="755" class="">IREF23 → 10k → GND</text><path class="w" d="M510 685 L560 685"/><rect class="box" x="925" y="625" width="320" height="140" rx="5"/><text x="941" y="661" class="h">R3 / TLC5928PW</text><text x="941" y="697" class="">SIN2 → SOUT22</text><text x="941" y="726" class="">pin5..20 → LED3 R</text><text x="941" y="755" class="">IREF23 → 10k → GND</text><path class="w" d="M875 685 L925 685"/><text x="1305" y="685" class="">→ ROW1.SER14</text><text x="40" y="870" class="">DATA_G</text><rect class="box" x="195" y="805" width="320" height="140" rx="5"/><text x="211" y="841" class="h">G1 / TLC5928PW</text><text x="211" y="877" class="">SIN2 → SOUT22</text><text x="211" y="906" class="">pin5..20 → LED1 G</text><text x="211" y="935" class="">IREF23 → 10k → GND</text><path class="w" d="M145 865 L195 865"/><rect class="box" x="560" y="805" width="320" height="140" rx="5"/><text x="576" y="841" class="h">G2 / TLC5928PW</text><text x="576" y="877" class="">SIN2 → SOUT22</text><text x="576" y="906" class="">pin5..20 → LED2 G</text><text x="576" y="935" class="">IREF23 → 10k → GND</text><path class="w" d="M510 865 L560 865"/><rect class="box" x="925" y="805" width="320" height="140" rx="5"/><text x="941" y="841" class="h">G3 / TLC5928PW</text><text x="941" y="877" class="">SIN2 → SOUT22</text><text x="941" y="906" class="">pin5..20 → LED3 G</text><text x="941" y="935" class="">IREF23 → 10k → GND</text><path class="w" d="M875 865 L925 865"/><text x="1305" y="865" class="">→ 未接続</text><rect class="box" x="40" y="1000" width="410" height="190" rx="5"/><text x="56" y="1036" class="h">16行シフトレジスター</text><text x="56" y="1072" class="">R3.SOUT22→ROW1.SER14</text><text x="56" y="1101" class="">ROW1.QH’9→ROW2.SER14</text><text x="56" y="1130" class="">SRCLK11=SCLK_R / RCLK12=LAT_R</text><text x="56" y="1159" class="">/CLR10=5V / /OE13=GND</text><rect class="box" x="515" y="1000" width="490" height="190" rx="5"/><text x="531" y="1036" class="h">行ドライバー ×16</text><text x="531" y="1072" class="">595.Q → ULN.IN1..8</text><text x="531" y="1101" class="">ULN.OUT18..11 → 100Ω → Q.G1</text><text x="531" y="1130" class="">Q.S2=5V / Q.D3=A_ROW[y]</text><text x="531" y="1159" class="">10k: Q.G1→Q.S2 / AO3401A</text><path class="w" d="M450 1090 L515 1090"/><rect class="box" x="1070" y="1000" width="490" height="190" rx="5"/><text x="1086" y="1036" class="h">LT-5016M1 ×3</text><text x="1086" y="1072" class="">全3枚の同じ行を共有</text><text x="1086" y="1101" class="">上端A0=pin16 / 下端A15=pin1</text><text x="1086" y="1130" class="">赤: 左R0=17 → 右R15=32</text><text x="1086" y="1159" class="">黄緑: 左G0=33 → 右G15=48</text><path class="w" d="M1005 1090 L1070 1090"/><text x="40" y="1250" class="h">走査：BLANK H → R64bit/G48bit → LAT各1回 → 100us待機 → BLANK L</text><text x="40" y="1290" class="">1MHz / 1行1ms / 16行62.5Hz / 点灯785us / LEDの平均電流 約0.247mA</text><text x="40" y="1330" class="">LED端子図は裏面の配置。左右反転して配線しない。前面の上端Row1をA0として定義。</text><text x="40" y="1370" class="">LTspiceのIC/LED/MOSは仮定モデル。4nF追加ゲート容量は試験負荷で、実装部品には含めない。</text><text x="40" y="1410" class="">判定：試作用。実部品の波形・温度・Vf・輝度と現品ピン向きの確認後に製作確定。</text></svg>