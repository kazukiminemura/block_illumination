ll">試作版：端子は資料と照合済み。LTspiceは動作近似モデルであり、実部品・基板の動作保証ではありません。</text><text x="48" y="2060" class="small">表示定義：0～9%=0段、10～19%=1段、…、90～99%=9段、100%=10段。</text><text x="48" y="2100" class="small">通常停止はPWM=0。Picoリセット時はRPD経由で放電するため、消灯まで数百msの遅れがあります。</text></svg>